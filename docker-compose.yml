version: "3.9"

services:
  app:
    # Dokploy builds this image from the repository on each deploy.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bryansmith-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bryansmith-nginx
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  checkpoint-nano-agent:
    image: checkpoint/infinity-next-nano-agent:latest
    container_name: checkpoint-nano-agent
    environment:
      - NANO_TENANT_ID=${NANO_TENANT_ID}
      - NANO_PROFILE_TOKEN=${NANO_PROFILE_TOKEN}
      - NANO_SERVICE_NAME=bryansmith-tech
      - NANO_MODE=protect
    # Shares Nginx network namespace to inspect inbound web traffic inline.
    network_mode: service:nginx
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped