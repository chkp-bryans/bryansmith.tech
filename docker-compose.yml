version: "3.9"

services:
  app:
    # Dokploy builds this image from the repository on each deploy.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bryansmith-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  appsec-waf:
    image: checkpoint/cloudguard-appsec-standalone:latest
    container_name: bryansmith-appsec-waf
    command: ["/cloudguard-appsec-standalone", "--token", "${NANO_PROFILE_TOKEN}"]
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
      - "443"
      - "8117"
    volumes:
      - appsec-conf:/etc/cp/conf
      - appsec-data:/etc/cp/data
      - appsec-logs:/var/log/nano_agent
      - appsec-certs:/etc/certs
    restart: unless-stopped

volumes:
  appsec-conf:
  appsec-data:
  appsec-logs:
  appsec-certs:
